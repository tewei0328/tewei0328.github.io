    <!-- Audio Synth (Web Audio API) & Main Script -->
    <script>
        // --- WEB AUDIO API SOUND SYSTEM ---
        let soundEnabled = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-comicDark text-base';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-popRed text-base';
            }
        }

        // Correct Sound: High Chime (Two tones)
        function playCorrectSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();

                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc1.frequency.setValueAtTime(783.99, now + 0.2); // G5

                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);

                osc1.start(now);
                osc1.stop(now + 0.4);
            } catch(e){}
        }

        // Incorrect Sound: Low Buzz
        function playIncorrectSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(110, now + 0.15);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.35);
            } catch(e){}
        }

        // Victory Sound
        function playFanfareSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const notes = [400, 500, 600, 800];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + i * 0.1);
                    osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
                });
            } catch(e){}
        }

        // --- QUESTION BANK (Database Systems Practice Questions) ---
        const ALL_QUESTIONS = [
            // Quiz 1: Q1 - Q10
            {
                id: 1,
                question: "在關聯式資料庫 (Relational Database) 中，用來唯一識別資料表中每一筆記錄的屬性組合稱為？",
                options: ["A. 外鍵 (Foreign Key)", "B. 主鍵 (Primary Key)", "C. 候選鍵 (Candidate Key)", "D. 複合鍵 (Composite Key)"],
                answer: 1,
                explanation: "【詳解】：主鍵 (Primary Key) 是從候選鍵中選出的唯一標示符，能唯一指定資料表中的每一列 (Tuple)，且不允許 NULL 值。"
            },
            {
                id: 2,
                question: "下列哪一個 SQL 指令屬於資料定義語言 (DDL, Data Definition Language)？",
                options: ["A. SELECT", "B. UPDATE", "C. CREATE", "D. INSERT"],
                answer: 2,
                explanation: "【詳解】：DDL 包含 CREATE、ALTER、DROP 等，用來定義或改變資料庫結構。SELECT、INSERT、UPDATE、DELETE 屬於 DML (Data Manipulation Language)。"
            },
            {
                id: 3,
                question: "交易 (Transaction) 必須滿足 ACID 特性，其中 'A' 代表什麼意義？",

                answer: 0,
                explanation: "【詳解】：ACID 分別為：Atomicity (原子性)、Consistency (一致性)、Isolation (隔離性)、Durability (持續性/永久性)。原子性確保交易要麼全部執行，要麼完全不執行 (All or Nothing)。"
            },
            {
                id: 4,
                question: "第一正規化 (1NF, First Normal Form) 的主要要求為何？",

                answer: 2,
                explanation: "【詳解】：1NF 要求資料表中的每一個欄位都必須是不可再分的原子值 (Atomic Values)，不可有重複群或陣列結構。"
            },
            {
                id: 5,
                question: "在關聯代數 (Relational Algebra) 中，π (Pi) 運算子代表什麼功能？",
                options: ["A. 選擇 (Selection)", "B. 投影 (Projection)", "C. 連接 (Join)", "D. 聯集 (Union)"],
                answer: 1,
                explanation: "【詳解】：π (Pi) 代表投影 (Projection)，用於篩選出關聯表中的特定「直行 (Columns/Attributes)」；σ (Sigma) 代表選擇 (Selection)，用於篩選「橫列 (Rows)」。"
            },
            {
                id: 6,
                question: "在資料庫正規化中，如果消除了對主鍵的「部分函數相依 (Partial Functional Dependency)」，該資料表達到第幾正規化？",
                options: ["A. 1NF", "B. 2NF", "C. 3NF", "D. BCNF"],
                answer: 1,
                explanation: "【詳解】：2NF 的定義是：符合 1NF，且所有非主鍵屬性必須完全函數相依 (Fully Functionally Dependent) 於主鍵，亦即消除部分相依。"
            },
            {
                id: 7,
                question: "SQL 中，若要對分組後的資料進行條件篩選 (例如過濾 COUNT(*) > 5)，應該使用哪個關鍵字？",
                options: ["A. WHERE", "B. GROUP BY", "C. HAVING", "D. ORDER BY"],
                answer: 2,
                explanation: "【詳解】：WHERE 用於群組前的個別紀錄篩選，HAVING 專門用於 GROUP BY 分組聚合函數後的條件過濾。"
            },
            {
                id: 8,
                question: "在 ER 模型 (Entity-Relationship Model) 中，菱形符號 (Diamond) 通常代表什麼？",
                options: ["A. 實體 (Entity)", "B. 屬性 (Attribute)", "C. 關聯 (Relationship)", "D. 弱實體 (Weak Entity)"],

            },
            {
                id: 9,
                question: "在 B+ Tree 索引結構中，實際的資料記錄 (Data Pointers/Records) 儲存在哪裡？",

            },
            {

                answer: 1,
                explanation: "【詳解】：共享鎖 (S-Lock) 用於讀取作業，多個交易可同時持有共享鎖；獨佔鎖 (X-Lock) 用於寫入，同一時間只允許一個交易持有。"
            },

            // Quiz 2: Q11 - Q20

                answer: 2,
                explanation: "【詳解】：死鎖 (Deadlock) 是指兩個或多個交易相互持有對方所需的鎖資源，形成循環等待 (Cyclic Wait)。"

            {

            },

            {

                id: 19,
                question: "SQL 中語句 `DELETE FROM Employees` 與 `TRUNCATE TABLE Employees` 的主要差別為何？",
                options: ["A. TRUNCATE 可以加 WHERE 條件，DELETE 不行", "B. DELETE 是 DML 且會逐行紀錄 Log；TRUNCATE 是 DDL，速度較快且釋放空間", "C. 兩者完全相同無差別", "D. TRUNCATE 無法清空整張表"],
                answer: 1,
                explanation: "【詳解】：DELETE 是 DML 操作，可觸發 Trigger 且逐筆記錄 Undo log；TRUNCATE 是 DDL，直接重新置位 Table 頁面與高水位線，執行速度極快。"
            },
            {
                id: 20,
                question: "聚集索引 (Clustered Index) 與非聚集索引 (Non-Clustered Index) 的核心差異是什麼？",
                options: ["A. 一張表可以有多個 Clustered Index", "B. Clustered Index 的物理儲存順序與索引順序一致，每張表只能有一個", "C. Non-Clustered Index 查詢速度必定比 Clustered Index 快", "D. Clustered Index 不佔用磁碟空間"],
                answer: 1,
                explanation: "【詳解】：Clustered Index 決定了資料在磁碟上的實際物理排列順序，因此一張表只能有一個 Clustered Index (通常為主鍵)。"
            }
        ];

        // --- APP STATE ---
        const QUESTIONS_PER_QUIZ = 10;
        let currentQuizIndex = 0; // 0 for Quiz 1 (Q1-10), 1 for Quiz 2 (Q11-20), etc.
        let userAnswers = {}; // key: global Question ID, value: selected option index
        let totalScore = 0;

        // --- INITIALIZATION ---
        window.onload = function() {
            renderQuizSelectorTabs();
            loadQuiz(0);
        };

        // Render Tabs for selecting Quiz Level (10 questions per quiz)
        function renderQuizSelectorTabs() {
            const totalQuizzes = Math.ceil(ALL_QUESTIONS.length / QUESTIONS_PER_QUIZ);
            const container = document.getElementById('quiz-selector-tabs');
            container.innerHTML = '';

            for (let i = 0; i < totalQuizzes; i++) {
                const startQ = i * QUESTIONS_PER_QUIZ + 1;
                const endQ = Math.min((i + 1) * QUESTIONS_PER_QUIZ, ALL_QUESTIONS.length);
                
                const btn = document.createElement('button');
                btn.id = `tab-btn-${i}`;
                btn.onclick = () => switchQuiz(i);
                btn.className = `option-btn comic-border rounded-xl px-4 py-2 text-sm font-extrabold flex items-center gap-2 ${
                    i === currentQuizIndex 
                    ? 'bg-popPink text-white shadow-pop' 
                    : 'bg-white text-comicDark shadow-pop-sm hover:bg-gray-50'
                }`;
                btn.innerHTML = `<i class="fa-solid fa-gamepad"></i> 測驗 ${i + 1} (Q${startQ}-Q${endQ})`;
                container.appendChild(btn);
            }
        }

        // Switch Active Quiz
        function switchQuiz(quizIdx) {
            currentQuizIndex = quizIdx;
            
            // Update Tab Styles
            const totalQuizzes = Math.ceil(ALL_QUESTIONS.length / QUESTIONS_PER_QUIZ);
            for (let i = 0; i < totalQuizzes; i++) {
                const tab = document.getElementById(`tab-btn-${i}`);
                if (tab) {
                    if (i === currentQuizIndex) {
                        tab.className = 'option-btn comic-border rounded-xl px-4 py-2 text-sm font-extrabold flex items-center gap-2 bg-popPink text-white shadow-pop';
                    } else {
                        tab.className = 'option-btn comic-border rounded-xl px-4 py-2 text-sm font-extrabold flex items-center gap-2 bg-white text-comicDark shadow-pop-sm hover:bg-gray-50';
                    }
                }
            }

            loadQuiz(quizIdx);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Load Questions for Selected Quiz Index
        function loadQuiz(quizIdx) {
            // Hide summary card
            document.getElementById('quiz-summary-card').classList.add('hidden');

            const startIdx = quizIdx * QUESTIONS_PER_QUIZ;
            const currentQuestions = ALL_QUESTIONS.slice(startIdx, startIdx + QUESTIONS_PER_QUIZ);
            
            // Update Headers & Indicators
            const startQNum = startIdx + 1;
            const endQNum = startIdx + currentQuestions.length;
            document.getElementById('level-indicator').innerText = `Quiz ${quizIdx + 1}`;
            document.getElementById('quiz-title-badge').innerText = `測驗 ${quizIdx + 1} (Q${startQNum} ~ Q${endQNum})`;

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            currentQuestions.forEach((q, idx) => {
                const qCard = createQuestionCard(q, startIdx + idx + 1);
                container.appendChild(qCard);
            });

            updateProgress();
        }

        // Build HTML Card for Single Question
        function createQuestionCard(q, displayIndex) {
            const card = document.createElement('div');
            card.id = `q-card-${q.id}`;
            card.className = 'bg-white comic-border rounded-3xl p-5 md:p-7 shadow-pop transition-all relative';

            const isAnswered = userAnswers.hasOwnProperty(q.id);
            const selectedOpt = userAnswers[q.id];

            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                let btnStyle = 'bg-white text-comicDark hover:bg-yellow-50 border-comicDark';
                let iconHTML = `<span class="w-7 h-7 rounded-lg border-2 border-comicDark flex items-center justify-center font-bold text-xs bg-gray-100 me-3">${String.fromCharCode(65 + optIdx)}</span>`;
                
                if (isAnswered) {
                    if (optIdx === q.answer) {
                        btnStyle = 'bg-popGreen text-comicDark font-black border-comicDark ring-4 ring-green-300';
                        iconHTML = `<span class="w-7 h-7 rounded-lg border-2 border-comicDark flex items-center justify-center font-bold text-xs bg-white text-popGreen me-3"><i class="fa-solid fa-check"></i></span>`;
                    } else if (optIdx === selectedOpt) {
                        btnStyle = 'bg-popRed text-white font-black border-comicDark';
                        iconHTML = `<span class="w-7 h-7 rounded-lg border-2 border-comicDark flex items-center justify-center font-bold text-xs bg-white text-popRed me-3"><i class="fa-solid fa-xmark"></i></span>`;
                    } else {
                        btnStyle = 'bg-gray-100 text-gray-400 opacity-60 border-gray-300';
                    }
                }

                optionsHTML += `
                    <button 
                        onclick="handleAnswer(${q.id}, ${optIdx})" 
                        ${isAnswered ? 'disabled' : ''}
                        class="option-btn w-full text-left p-3.5 md:p-4 rounded-2xl comic-border font-bold text-base md:text-lg flex items-center transition-all ${btnStyle}"
                    >
                        ${iconHTML}
                        <span class="flex-grow">${opt.substring(3)}</span>
                    </button>
                `;
            });

            // Explanation Section
            const expStyle = isAnswered ? 'block' : 'hidden';
            const isCorrect = isAnswered && selectedOpt === q.answer;
            const expBadgeColor = isCorrect ? 'bg-popGreen text-comicDark' : 'bg-popRed text-white';
            const expBadgeText = isCorrect ? '🎉 答對了！ Great Job!' : '❌ 答錯了！ Keep Fighting!';

            card.innerHTML = `
                <!-- Question Tag Header -->
                <div class="flex items-center justify-between mb-4">
                    <span class="bg-popYellow text-comicDark font-black text-sm px-3.5 py-1 rounded-xl comic-border shadow-pop-sm">
                        第 ${displayIndex} 題 / Question ${displayIndex}
                    </span>
                    <span class="text-xs font-extrabold text-gray-400">ID: #${q.id}</span>
                </div>

                <!-- Question Text -->
                <h3 class="text-lg md:text-xl font-black text-comicDark mb-5 leading-relaxed">
                    ${q.question}
                </h3>

                <!-- Options -->
                <div class="space-y-3 mb-4">
                    ${optionsHTML}
                </div>

                <!-- Immediate Feedback & Explanation Box -->
                <div id="explanation-${q.id}" class="${expStyle} mt-5 bg-yellow-50 comic-border rounded-2xl p-4 md:p-5 shadow-pop-sm">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="${expBadgeColor} font-black text-xs px-3 py-1 rounded-lg comic-border shadow-pop-sm">
                            ${expBadgeText}
                        </span>
                    </div>
                    <div class="text-sm md:text-base font-bold text-comicDark leading-relaxed pt-1">
                        ${q.explanation}
                    </div>
                </div>
            `;

            return card;
        }

        // Handle Option Click
        function handleAnswer(questionId, selectedOptionIdx) {
            if (userAnswers.hasOwnProperty(questionId)) return; // Already answered

            const question = ALL_QUESTIONS.find(q => q.id === questionId);
            userAnswers[questionId] = selectedOptionIdx;

            const isCorrect = selectedOptionIdx === question.answer;

            // Play Web Audio FX
            if (isCorrect) {
                playCorrectSound();
                totalScore += 10;
            } else {
                playIncorrectSound();
            }

            // Update Total Global Score Display
            document.getElementById('total-score').innerText = totalScore;

            // Re-render Question Card
            const currentQuestions = ALL_QUESTIONS.slice(currentQuizIndex * QUESTIONS_PER_QUIZ, (currentQuizIndex + 1) * QUESTIONS_PER_QUIZ);
            const questionIndex = currentQuestions.findIndex(q => q.id === questionId);
            const displayNum = currentQuizIndex * QUESTIONS_PER_QUIZ + questionIndex + 1;

            const oldCard = document.getElementById(`q-card-${questionId}`);
            const newCard = createQuestionCard(question, displayNum);
            oldCard.replaceWith(newCard);

            // Update Progress Bar & Check Finish Status
            updateProgress();
        }

        // Update Progress Bar & Stats
        function updateProgress() {
            const startIdx = currentQuizIndex * QUESTIONS_PER_QUIZ;
            const currentQuestions = ALL_QUESTIONS.slice(startIdx, startIdx + QUESTIONS_PER_QUIZ);
            
            let answeredCount = 0;
            let correctCount = 0;
            let wrongCount = 0;

            currentQuestions.forEach(q => {
                if (userAnswers.hasOwnProperty(q.id)) {
                    answeredCount++;
                    if (userAnswers[q.id] === q.answer) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                }
            });

            const total = currentQuestions.length;
            const percent = (answeredCount / total) * 100;

            document.getElementById('progress-text').innerText = `完成度: ${answeredCount} / ${total} 題`;
            document.getElementById('quiz-correct-count').innerText = correctCount;
            document.getElementById('quiz-wrong-count').innerText = wrongCount;
            document.getElementById('progress-bar-fill').style.width = `${percent}%`;

            // If all 10 questions in this quiz are answered, trigger Quiz Summary
            if (answeredCount === total && total > 0) {
                showQuizSummary(correctCount, total);
            }
        }

        // Show Summary Results Card & Confetti
        function showQuizSummary(correct, total) {
            const percent = Math.round((correct / total) * 100);
            const summaryCard = document.getElementById('quiz-summary-card');
            
            document.getElementById('summary-quiz-name').innerText = `測驗 ${currentQuizIndex + 1} (Q${currentQuizIndex * QUESTIONS_PER_QUIZ + 1} - Q${Math.min((currentQuizIndex + 1) * QUESTIONS_PER_QUIZ, ALL_QUESTIONS.length)}) 完成！`;
            document.getElementById('summary-score-percent').innerText = `${percent}%`;
            document.getElementById('summary-correct').innerText = correct;
            document.getElementById('summary-points').innerText = correct * 10;

            let feedbackMsg = "太優秀了！你簡直是資料庫大師！💥";
            if (percent < 60) {
                feedbackMsg = "加油！再讀一下觀念，重新挑戰一次吧！💪";
            } else if (percent < 90) {
                feedbackMsg = "表現很棒喔！細心複習一下觀念會更好！✨";
            }
            document.getElementById('summary-feedback-msg').innerText = feedbackMsg;

            // Handle Next Quiz Button state
            const totalQuizzes = Math.ceil(ALL_QUESTIONS.length / QUESTIONS_PER_QUIZ);
            const nextBtn = document.getElementById('next-quiz-btn');
            if (currentQuizIndex >= totalQuizzes - 1) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }

            summaryCard.classList.remove('hidden');

            // Trigger Confetti & Sound
            if (percent >= 60) {
                playFanfareSound();
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Smooth scroll to summary card
            setTimeout(() => {
                summaryCard.scrollIntoView({ behavior: 'smooth' });
            }, 300);
        }

        // Retry current 10 questions
        function retryCurrentQuiz() {
            const startIdx = currentQuizIndex * QUESTIONS_PER_QUIZ;
            const currentQuestions = ALL_QUESTIONS.slice(startIdx, startIdx + QUESTIONS_PER_QUIZ);

            currentQuestions.forEach(q => {
                delete userAnswers[q.id];
            });

            loadQuiz(currentQuizIndex);
        }

        // Go to next 10 questions
        function goToNextQuiz() {
            const totalQuizzes = Math.ceil(ALL_QUESTIONS.length / QUESTIONS_PER_QUIZ);
            if (currentQuizIndex < totalQuizzes - 1) {
                switchQuiz(currentQuizIndex + 1);
            }
        }
    </script>
</body>
</html>
