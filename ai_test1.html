                    { label: "B. 是、是、否", value: "B" },
                    { label: "C. 否、是、是", value: "C" },
                    { label: "D. 是、否、是", value: "D" }
                ],
                answer: "B",
                details: "子題 1 & 2：透過獨立權威來源（學術資源、歷史資料庫）交叉比對是標準做法；子題 3：另一個 AI 同樣有幻覺風險，不能作為權威驗證基準。"
            }
        ];

        // Web Audio API 音效產生器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, index) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                    g.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.4);
                    o.start(audioCtx.currentTime + index * 0.1);
                    o.stop(audioCtx.currentTime + index * 0.1 + 0.4);
                });
            }
        }

        // 初始化頁面
        document.addEventListener("DOMContentLoaded", () => {
            renderFlashcards();
            initQuiz();
        });

        // 頁籤切換邏輯
        function switchTab(tab) {
            const studySection = document.getElementById("tab-study");
            const quizSection = document.getElementById("tab-quiz");
            const btnStudy = document.getElementById("btn-study");
            const btnQuiz = document.getElementById("btn-quiz");

            if (tab === 'study') {
                studySection.classList.remove("hidden");
                quizSection.classList.add("hidden");
                btnStudy.className = "cartoon-btn bg-white text-gray-900 font-bold px-4 py-2 rounded-xl text-sm md:text-base";
                btnQuiz.className = "cartoon-btn bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-sm md:text-base";
            } else {
                studySection.classList.add("hidden");
                quizSection.classList.remove("hidden");
                btnQuiz.className = "cartoon-btn bg-white text-gray-900 font-bold px-4 py-2 rounded-xl text-sm md:text-base";
                btnStudy.className = "cartoon-btn bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-sm md:text-base";
            }
        }

        // 渲染知識卡片 (Flashcards)
        function renderFlashcards() {
            const container = document.getElementById("flashcards-container");
            container.innerHTML = "";

            questionsData.forEach(item => {
                const cardEl = document.createElement("div");
                cardEl.className = "h-80 perspective-1000 cursor-pointer";
                cardEl.innerHTML = `
                    <div class="flip-card-inner relative w-full h-full rounded-2xl cartoon-box bg-white">
                        <!-- 正面 -->
                        <div class="flip-card-front absolute inset-0 w-full h-full p-6 flex flex-col justify-between bg-yellow-50 rounded-2xl overflow-y-auto">
                            <div>
                                <span class="bg-indigo-600 text-white text-xs font-black px-2.5 py-1 rounded-md cartoon-box-sm">第 ${item.id} 題 (${item.code})</span>
                                <p class="text-gray-800 font-bold mt-4 whitespace-pre-line text-sm md:text-base">${item.question}</p>
                            </div>
                            <div class="text-center text-xs font-bold text-indigo-500 mt-2 bg-indigo-50 py-1.5 rounded-lg border border-indigo-200">
                                🔄 點擊卡片翻轉看答案與詳解
                            </div>
                        </div>
                        <!-- 背面 -->
                        <div class="flip-card-back absolute inset-0 w-full h-full p-6 flex flex-col justify-between bg-green-50 rounded-2xl overflow-y-auto">
                            <div>
                                <span class="bg-green-600 text-white text-xs font-black px-2.5 py-1 rounded-md cartoon-box-sm">正確解答：${item.answer}</span>
                                <div class="mt-3 text-gray-800 text-xs md:text-sm font-medium space-y-1">
                                    <p class="font-bold text-green-900">📝 詳細解析：</p>
                                    <p>${item.details}</p>
                                </div>
                            </div>
                            <div class="text-center text-xs font-bold text-green-600 mt-2 bg-green-100 py-1.5 rounded-lg border border-green-200">
                                🔄 點擊卡片翻回正面
                            </div>
                        </div>
                    </div>
                `;

                cardEl.addEventListener("click", () => {
                    const inner = cardEl.querySelector(".flip-card-inner");
                    inner.classList.toggle("flipped");
                });

                container.appendChild(cardEl);
            });
        }

        // 測驗系統狀態
        let currentQuizIndex = 0;
        let score = 0;
        let answered = false;

        function initQuiz() {
            currentQuizIndex = 0;
            score = 0;
            document.getElementById("quiz-result").classList.add("hidden");
            document.getElementById("quiz-container").parentElement.classList.remove("hidden");
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            answered = false;
            const item = questionsData[currentQuizIndex];
            document.getElementById("quiz-progress").innerText = `題目 ${currentQuizIndex + 1} / ${questionsData.length}`;
            document.getElementById("quiz-score").innerText = `得分：${score}`;
            document.getElementById("next-btn").classList.add("hidden");

            const container = document.getElementById("quiz-container");
            container.innerHTML = `
                <div class="bg-indigo-50 p-4 rounded-xl border-2 border-indigo-200 mb-4">
                    <span class="bg-indigo-600 text-white text-xs font-black px-2 py-0.5 rounded">題號：${item.code}</span>
                    <p class="text-gray-900 font-bold mt-2 whitespace-pre-line text-base md:text-lg">${item.question}</p>
                </div>
                <div id="options-list" class="grid grid-cols-1 gap-3">
                    ${item.options.map(opt => `
                        <button onclick="selectOption('${opt.value}')" data-value="${opt.value}" class="option-btn cartoon-btn bg-white hover:bg-yellow-100 text-left p-4 rounded-xl font-bold text-gray-800 text-sm md:text-base flex items-center justify-between">
                            <span>${opt.label}</span>
                        </button>
                    `).join('')}
                </div>
                <div id="quiz-explanation" class="hidden mt-4 p-4 rounded-xl border-2"></div>
            `;
        }

        function selectOption(selectedVal) {
            if (answered) return;
            answered = true;

            const item = questionsData[currentQuizIndex];
            const isCorrect = (selectedVal === item.answer);
            
            if (isCorrect) {
                score += 10;
                playSound('correct');
            } else {
                playSound('wrong');
            }

            document.getElementById("quiz-score").innerText = `得分：${score}`;

            const optionBtns = document.querySelectorAll(".option-btn");
            optionBtns.forEach(btn => {
                const val = btn.getAttribute("data-value");
                btn.disabled = true;
                if (val === item.answer) {
                    btn.className = "option-btn cartoon-btn bg-green-300 text-gray-900 text-left p-4 rounded-xl font-bold text-sm md:text-base flex items-center justify-between border-4 border-green-600";
                } else if (val === selectedVal && !isCorrect) {
                    btn.className = "option-btn cartoon-btn bg-red-300 text-gray-900 text-left p-4 rounded-xl font-bold text-sm md:text-base flex items-center justify-between border-4 border-red-600";
                }
            });

            const expBox = document.getElementById("quiz-explanation");
            expBox.classList.remove("hidden");
            if (isCorrect) {
                expBox.className = "mt-4 p-4 rounded-xl border-2 bg-green-100 border-green-400 text-green-900";
                expBox.innerHTML = `<p class="font-black text-lg">✅ 答對了！太棒了！</p><p class="mt-1 text-sm font-medium"><strong>解析：</strong>${item.details}</p>`;
            } else {
                expBox.className = "mt-4 p-4 rounded-xl border-2 bg-red-100 border-red-400 text-red-900";
                expBox.innerHTML = `<p class="font-black text-lg">❌ 答錯囉！正確答案是：${item.answer}</p><p class="mt-1 text-sm font-medium"><strong>解析：</strong>${item.details}</p>`;
            }

            const nextBtn = document.getElementById("next-btn");
            nextBtn.classList.remove("hidden");
            if (currentQuizIndex === questionsData.length - 1) {
                nextBtn.innerText = "查看測驗結果 🏆";
            }
        }

        function nextQuestion() {
            currentQuizIndex++;
            if (currentQuizIndex < questionsData.length) {
                renderQuizQuestion();
            } else {
                showQuizResult();
            }
        }

        function showQuizResult() {
            playSound('win');
            document.getElementById("quiz-container").parentElement.classList.add("hidden");
            const resultBox = document.getElementById("quiz-result");
            resultBox.classList.remove("hidden");

            const maxScore = questionsData.length * 10;
            const percentage = Math.round((score / maxScore) * 100);
            let comment = "";

            if (percentage === 100) {
                comment = "🌟 滿分通關！您已經完全掌握 CCS AI 是非題考點，太神啦！";
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            } else if (percentage >= 80) {
                comment = "🎉 成績優異！觀念非常扎實，離滿分只差一點點！";
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            } else if (percentage >= 60) {
                comment = "👍 及格過關！建議針對答錯的卡片再多複習幾次喔！";
            } else {
                comment = "💪 還需要加油喔！建議多使用「知識卡片學習」模式重新複習！";
            }

            document.getElementById("result-text").innerHTML = `
                您的總得分：<span class="text-2xl font-black text-indigo-600">${score}</span> 分 (滿分 ${maxScore} 分)<br>
                正確率：<span class="text-xl font-black text-green-600">${percentage}%</span><br><br>
                <span class="text-base text-gray-700">${comment}</span>
            `;
        }

        function restartQuiz() {
            initQuiz();
        }
    </script>
</body>
</html>
