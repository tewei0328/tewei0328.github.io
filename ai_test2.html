        class QuizApp {
            constructor(questions) {
                this.questions = questions;
                this.currentIndex = 0;
                this.userAnswers = {};
                this.bookmarks = new Set();
                this.activeFilter = 'all';
                this.filteredIndices = Array.from({length: questions.length}, (_, i) => i);

                this.initElements();
                this.bindEvents();
                this.renderGridButtons();
                this.renderQuestion();
            }

            initElements() {
                this.container = document.getElementById('questionContainer');
                this.resultContainer = document.getElementById('resultContainer');
                this.progressBar = document.getElementById('progressBar');
                this.progressText = document.getElementById('progressText');
                this.scoreText = document.getElementById('scoreText');
                this.accuracyText = document.getElementById('accuracyText');
                this.bookmarkText = document.getElementById('bookmarkText');
                this.gridDrawer = document.getElementById('questionGridDrawer');
                this.gridButtonsContainer = document.getElementById('questionGridButtons');
            }

            bindEvents() {
                document.getElementById('themeToggle').addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                });

                if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            toggleQuestionGrid() {
                this.gridDrawer.classList.toggle('hidden');
            }

            setFilter(filterType) {
                this.activeFilter = filterType;
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.className = "filter-btn px-3 py-1.5 rounded-xl font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors";
                });
                const activeBtn = document.getElementById(`filter-${filterType}`);
                if (activeBtn) {
                    activeBtn.className = "filter-btn px-3 py-1.5 rounded-xl font-medium bg-brand-500 text-white transition-colors";
                }

                this.updateFilteredIndices();

                if (this.filteredIndices.length > 0) {
                    this.currentIndex = this.filteredIndices[0];
                    this.renderQuestion();
                } else {
                    this.container.innerHTML = `
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-12 text-center border border-slate-200 dark:border-slate-700 shadow-sm">
                            <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3 block"></i>
                            <p class="text-slate-600 dark:text-slate-300 font-medium">此篩選條件下無符合的題目。</p>
                            <button onclick="quizApp.setFilter('all')" class="mt-4 px-4 py-2 bg-brand-500 text-white text-xs font-semibold rounded-xl">返回全部 58 題</button>
                        </div>
                    `;
                }
            }

            updateFilteredIndices() {
                this.filteredIndices = [];
                this.questions.forEach((q, idx) => {
                    const ans = this.userAnswers[q.id];
                    if (this.activeFilter === 'all') {
                        this.filteredIndices.push(idx);
                    } else if (this.activeFilter === 'unanswered' && !ans) {
                        this.filteredIndices.push(idx);
                    } else if (this.activeFilter === 'incorrect' && ans && !ans.isCorrect) {
                        this.filteredIndices.push(idx);
                    } else if (this.activeFilter === 'bookmarked' && this.bookmarks.has(q.id)) {
                        this.filteredIndices.push(idx);
                    }
                });
            }

            toggleBookmark(qId) {
                if (this.bookmarks.has(qId)) {
                    this.bookmarks.delete(qId);
                } else {
                    this.bookmarks.add(qId);
                }
                this.bookmarkText.innerText = `${this.bookmarks.size} 題`;
                this.renderGridButtons();
                this.renderQuestion();
            }

            updateDashboard() {
                const total = this.questions.length;
                const answeredCount = Object.keys(this.userAnswers).length;
                let correctCount = 0;

                Object.values(this.userAnswers).forEach(ans => {
                    if (ans.isCorrect) correctCount++;
                });

                const calculatedScore = (correctCount / total) * 100;
                const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

                this.progressText.innerText = `${answeredCount} / ${total}`;
                this.scoreText.innerText = `${Math.round(calculatedScore)} 分`;
                this.accuracyText.innerText = `${accuracy}%`;

                const progressPercent = (answeredCount / total) * 100;
                this.progressBar.style.width = `${progressPercent}%`;

                this.renderGridButtons();
            }

            renderGridButtons() {
                this.gridButtonsContainer.innerHTML = '';
                this.questions.forEach((q, idx) => {
                    const ans = this.userAnswers[q.id];
                    const isCurrent = idx === this.currentIndex;
                    const isBookmarked = this.bookmarks.has(q.id);

                    let btnClass = "relative h-9 text-xs font-bold rounded-xl border transition-all flex items-center justify-center ";

                    if (isCurrent) {
                        btnClass += "ring-2 ring-brand-500 ring-offset-2 dark:ring-offset-slate-800 ";
                    }

                    if (ans) {
                        if (ans.isCorrect) {
                            btnClass += "bg-emerald-500 text-white border-emerald-600";
                        } else {
                            btnClass += "bg-rose-500 text-white border-rose-600";
                        }
                    } else {
                        btnClass += "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-600 hover:bg-slate-200";
                    }

                    const btn = document.createElement('button');
                    btn.className = btnClass;
                    btn.innerHTML = `
                        Q${idx + 1}
                        ${isBookmarked ? '<span class="absolute -top-1 -right-1 text-amber-400 text-[10px]"><i class="fa-solid fa-star"></i></span>' : ''}
                    `;
                    btn.onclick = () => {
                        this.currentIndex = idx;
                        this.renderQuestion();
                        this.gridDrawer.classList.add('hidden');
                    };

                    this.gridButtonsContainer.appendChild(btn);
                });
            }

            renderQuestion() {
                this.resultContainer.classList.add('hidden');
                this.container.classList.remove('hidden');

                const q = this.questions[this.currentIndex];
                const isAnswered = !!this.userAnswers[q.id];
                const savedState = this.userAnswers[q.id];
                const isBookmarked = this.bookmarks.has(q.id);

                let html = `
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-xl transition-all">
                        <div class="flex items-center justify-between mb-4 border-b border-slate-100 dark:border-slate-700/60 pb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold px-3 py-1 rounded-full bg-brand-50 text-brand-600 dark:bg-brand-900/40 dark:text-brand-400">
                                    單選題
                                </span>
                                <span class="text-xs font-semibold text-slate-400">
                                    ID: #${q.id}
                                </span>
                            </div>

                            <div class="flex items-center gap-3">
                                <button onclick="quizApp.toggleBookmark(${q.id})" class="text-sm font-medium text-slate-400 hover:text-amber-500 flex items-center gap-1 transition-colors">
                                    <i class="${isBookmarked ? 'fa-solid text-amber-500' : 'fa-regular'} fa-bookmark"></i>
                                    <span class="text-xs hidden sm:inline">${isBookmarked ? '已標記' : '標記此題'}</span>
                                </button>
                                <span class="text-xs text-slate-400 dark:text-slate-500 font-medium">
                                    第 ${this.currentIndex + 1} / 58 題
                                </span>
                            </div>
                        </div>

                        <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white mb-3 leading-relaxed">
                            ${q.title}
                        </h2>
                        <div class="text-slate-700 dark:text-slate-300 text-sm sm:text-base leading-relaxed mb-6">
                            ${q.question}
                        </div>
                `;

                html += `<div class="space-y-3 mb-6">`;
                q.options.forEach(opt => {
                    let btnClass = "w-full text-left p-4 rounded-2xl border transition-all flex items-start gap-3.5 text-sm sm:text-base ";
                    let iconHtml = `<span class="w-6 h-6 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center font-semibold text-xs text-slate-500 dark:text-slate-400 shrink-0 mt-0.5">${opt.id}</span>`;

                    if (isAnswered) {
                        if (opt.id === q.correctAnswer) {
                            btnClass += "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-900 dark:text-emerald-200 font-medium";
                            iconHtml = `<span class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs shrink-0 mt-0.5"><i class="fa-solid fa-check"></i></span>`;
                        } else if (savedState.userSelection === opt.id) {
                            btnClass += "bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-900 dark:text-rose-200";
                            iconHtml = `<span class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs shrink-0 mt-0.5"><i class="fa-solid fa-xmark"></i></span>`;
                        } else {
                            btnClass += "bg-slate-50/50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 opacity-60";
                        }
                    } else {
                        btnClass += "bg-slate-50 hover:bg-slate-100 dark:bg-slate-700/50 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 hover:border-brand-300 dark:hover:border-brand-500";
                    }

                    html += `
                        <button ${isAnswered ? 'disabled' : ''} onclick="quizApp.selectOption('${opt.id}')" class="${btnClass}">
                            ${iconHtml}
                            <span class="flex-1">${opt.text}</span>
                        </button>
                    `;
                });
                html += `</div>`;

                if (isAnswered) {
                    const isCorrect = savedState.isCorrect;
                    html += `
                        <div class="mt-6 p-5 rounded-2xl border ${isCorrect ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800/50' : 'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800/50'} space-y-3">
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 text-xs font-bold rounded-lg text-white ${isCorrect ? 'bg-emerald-500' : 'bg-rose-500'}">
                                    ${isCorrect ? '<i class="fa-solid fa-circle-check mr-1"></i>回答正確' : '<i class="fa-solid fa-circle-xmark mr-1"></i>回答錯誤'}
                                </span>
                                <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">
                                    標準答案：${q.correctAnswer}
                                </span>
                            </div>
                            <div class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed border-t border-slate-200/60 dark:border-slate-700/60 pt-3">
                                <strong class="text-slate-900 dark:text-white block mb-1"><i class="fa-solid fa-lightbulb text-amber-500 mr-1.5"></i>詳解與觀念說明：</strong>
                                ${q.explanation}
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="mt-8 pt-4 border-t border-slate-100 dark:border-slate-700/60 flex justify-between items-center">
                        <button onclick="quizApp.prevQuestion()" ${this.currentIndex === 0 ? 'disabled' : ''} class="px-4 py-2 text-sm font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30 transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-arrow-left"></i>上一題
                        </button>

                        <div class="flex gap-2">
                            ${this.currentIndex < this.questions.length - 1 ? `
                                <button onclick="quizApp.nextQuestion()" class="px-5 py-2.5 text-sm font-semibold rounded-xl bg-brand-600 hover:bg-brand-700 text-white shadow-md transition-all flex items-center gap-1.5">
                                    下一題<i class="fa-solid fa-arrow-right"></i>
                                </button>
                            ` : `
                                <button onclick="quizApp.finishQuiz()" class="px-5 py-2.5 text-sm font-semibold rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white shadow-md transition-all flex items-center gap-1.5">
                                    完成測驗<i class="fa-solid fa-flag-checkered"></i>
                                </button>
                            `}
                        </div>
                    </div>
                `;

                html += `</div>`;
                this.container.innerHTML = html;
                this.updateDashboard();
            }

            selectOption(optionId) {
                const q = this.questions[this.currentIndex];
                const isCorrect = optionId === q.correctAnswer;

                this.userAnswers[q.id] = {
                    userSelection: optionId,
                    isCorrect: isCorrect
                };

                this.renderQuestion();
            }

            nextQuestion() {
                if (this.currentIndex < this.questions.length - 1) {
                    this.currentIndex++;
                    this.renderQuestion();
                }
            }

            prevQuestion() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.renderQuestion();
                }
            }

            finishQuiz() {
                this.container.classList.add('hidden');
                this.resultContainer.classList.remove('hidden');

                let correctCount = 0;
                Object.values(this.userAnswers).forEach(ans => {
                    if (ans.isCorrect) correctCount++;
                });

                const finalScore = Math.round((correctCount / this.questions.length) * 100);
                const accuracy = Math.round((correctCount / this.questions.length) * 100);

                document.getElementById('finalCorrectCount').innerText = `${correctCount} / ${this.questions.length} 題`;
                document.getElementById('finalScore').innerText = `${finalScore} 分`;
                document.getElementById('finalAccuracy').innerText = `${accuracy}%`;

                const feedbackElem = document.getElementById('resultFeedbackText');
                if (finalScore === 100) {
                    feedbackElem.className = "text-sm font-medium px-4 py-3 rounded-xl max-w-md mx-auto bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-200";
                    feedbackElem.innerHTML = "<i class='fa-solid fa-star text-amber-500 mr-1.5'></i>太優秀了！獲得滿分！您已完美通關生成式 AI 認證題庫！";
                } else if (finalScore >= 70) {
                    feedbackElem.className = "text-sm font-medium px-4 py-3 rounded-xl max-w-md mx-auto bg-brand-100 text-brand-800 dark:bg-brand-900/50 dark:text-brand-200";
                    feedbackElem.innerHTML = "<i class='fa-solid fa-circle-check text-brand-500 mr-1.5'></i>恭喜通過門檻 (70分)！檢視錯題並加以複習即可穩拿認證標章！";
                } else {
                    feedbackElem.className = "text-sm font-medium px-4 py-3 rounded-xl max-w-md mx-auto bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-200";
                    feedbackElem.innerHTML = "<i class='fa-solid fa-triangle-exclamation text-amber-500 mr-1.5'></i>未達 70 分及格標準，建議善用「錯題篩選」進行再強化！";
                }

                this.progressBar.style.width = '100%';
            }

            restartQuiz() {
                this.currentIndex = 0;
                this.userAnswers = {};
                this.activeFilter = 'all';
                this.updateFilteredIndices();
                this.renderQuestion();
            }

            reviewAllQuestions() {
                this.resultContainer.classList.add('hidden');
                this.container.classList.remove('hidden');

                let reviewHtml = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <h2 class="font-bold text-slate-800 dark:text-white text-base sm:text-lg"><i class="fa-solid fa-list-check text-brand-500 mr-2"></i>全 58 題完整題目與詳細解析總覽</h2>
                            <button onclick="quizApp.restartQuiz()" class="px-4 py-2 text-xs bg-brand-600 text-white rounded-xl font-medium hover:bg-brand-700">重頭刷題</button>
                        </div>
                `;

                this.questions.forEach((q, idx) => {
                    const userAns = this.userAnswers[q.id];
                    const isCorrect = userAns ? userAns.isCorrect : false;

                    reviewHtml += `
                        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-slate-900 dark:text-white">${q.title}</span>
                                ${userAns ? (
                                    isCorrect ? 
                                    '<span class="text-xs bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-bold px-2.5 py-1 rounded-lg">答對</span>' : 
                                    '<span class="text-xs bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300 font-bold px-2.5 py-1 rounded-lg">答錯</span>'
                                ) : '<span class="text-xs bg-slate-100 text-slate-500 font-bold px-2.5 py-1 rounded-lg">未作答</span>'}
                            </div>
                            <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${q.question}</p>
                            <div class="p-4 bg-slate-50 dark:bg-slate-900/50 rounded-xl text-xs sm:text-sm space-y-2 border border-slate-100 dark:border-slate-800">
                                <div class="text-emerald-600 dark:text-emerald-400 font-semibold">標準答案：${q.correctAnswer}</div>
                                <div class="text-slate-600 dark:text-slate-400 leading-relaxed"><strong class="text-slate-700 dark:text-slate-300">詳解：</strong>${q.explanation}</div>
                            </div>
                        </div>
                    `;
                });

                reviewHtml += `</div>`;
                this.container.innerHTML = reviewHtml;
            }
        }

        let quizApp;
        window.onload = function() {
            quizApp = new QuizApp(quizData);
        };
    </script>
</body>
</html>
